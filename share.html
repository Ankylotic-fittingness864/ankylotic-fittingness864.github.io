<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-m8Uh//xNtxcutq0q2ZQzQiIppiry12sFkTMV3OcZBG4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>رفيق</title>
<meta name="theme-color" content="#EEF1F5">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#EEF1F5;color:#16213A;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(238,241,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid #E1E5EC}
.bar .note{flex:1;font-size:13px;color:#4B5563;font-weight:600}
.bar button{border:1px solid #1F3366;background:#1F3366;color:#fff;border-radius:10px;min-height:36px;padding:0 14px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
main{padding:20px 16px 50px}
.msg{max-width:460px;margin:12vh auto;text-align:center;color:#4B5563;background:#fff;border:1px solid #E1E5EC;border-radius:16px;padding:28px 20px}
.msg .mk{width:52px;height:52px;border-radius:15px;background:#1F3366;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-family:'Readex Pro',sans-serif;font-weight:700;font-size:24px}
.spin{display:block;width:28px;height:28px;border-radius:50%;border:3px solid #E1E5EC;border-top-color:#1F3366;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{ @page{size:A4;margin:11mm} body{background:#fff} .bar{display:none} main{padding:0} }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="bar" id="bar" hidden><span class="note" id="note"></span><button type="button" id="printBtn"></button></div>
<main id="out"><div class="msg"><span class="spin"></span></div></main>
<script type="module">
import { reportHTML, ensureReportCSS, monthName } from './js/report.js';
import { DICT } from './js/i18n.js';
const out = document.getElementById('out');
const CFG = window.RAFEEQ_CONFIG || {};
let tok = ''; try { tok = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim(); } catch { tok = ''; }
const fail = (lang = 'ar') => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; out.innerHTML = `<div class="msg"><div class="mk">${lang === 'ar' ? 'ر' : 'R'}</div>${DICT[lang].shareInvalid}</div>`; };
async function load() {
  if (!tok || tok.length < 20 || !CFG.supabaseUrl) return fail();
  try {
    const r = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/get_share', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + CFG.supabaseAnonKey }, body: JSON.stringify({ tok }) });
    const d = r.ok ? await r.json() : null;
    if (!d || !d.payload) return fail();
    const snap = d.payload; const lang = snap.lang === 'en' ? 'en' : 'ar';
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = d.title || DICT[lang].rpTitle.replace('{m}', monthName(lang, snap.period));
    ensureReportCSS();
    out.innerHTML = reportHTML(snap);
    document.getElementById('note').textContent = DICT[lang].shareNote;
    const pb = document.getElementById('printBtn'); pb.textContent = DICT[lang].savePdf; pb.onclick = () => window.print();
    document.getElementById('bar').hidden = false;
  } catch (e) { console.warn(e); fail(); }
}
load();
</script>
</body>
</html>
