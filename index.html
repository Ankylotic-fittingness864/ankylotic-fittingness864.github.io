<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://drive.google.com https://docs.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق</title>
<meta name="description" content="مهامك ومتابعاتك في مكان واحد">
<meta name="theme-color" content="#EEF1F5">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رفيق">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* رفيق — light by default: white, light grey, navy, slate. Dark only by explicit choice. */
:root{
  --paper:#EEF1F5; --card:#FFFFFF; --ink:#16213A; --ink-2:#4B5563; --ink-3:#8A93A3; --line:#E1E5EC; --line-2:#C9CFD9;
  --accent:#1F3366; --accent-2:#16264D; --accent-ink:#FFFFFF; --accent-soft:#E6EAF3;
  --late:#B4372E; --late-soft:#F8E8E6; --wait:#9A6510; --wait-soft:#F7EEDD; --done:#1F7A50; --done-soft:#E3F1EA;
  --shadow:0 1px 2px rgba(22,33,58,.05),0 4px 14px rgba(22,33,58,.06); --shadow-up:0 -8px 30px rgba(22,33,58,.14);
  --f-display:'Readex Pro','IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --r:16px; --r-sm:12px; color-scheme:light;
}
.shell[data-mode="dark"]{
  --paper:#0F1522; --card:#182033; --ink:#E8ECF3; --ink-2:#AEB6C4; --ink-3:#7C8596; --line:#263049; --line-2:#334060;
  --accent:#9FB2DA; --accent-2:#C3D0EA; --accent-ink:#0F1522; --accent-soft:#1F2A44;
  --late:#F08A80; --late-soft:#3A2220; --wait:#E0B060; --wait-soft:#352A16; --done:#6FCF9E; --done-soft:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-up:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#E3E7EE;font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.shell{min-height:100vh;background:var(--paper);color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--ink-3)}
em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:.92em}

/* splash / login / onboarding */
#splash{min-height:100vh;display:grid;place-items:center}
.brand-mark{width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:700}
.brand-mark.sm{width:34px;height:34px;border-radius:10px;font-size:17px}
.login{min-height:100vh;display:flex;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.login-in,.onb{width:100%;max-width:420px;display:flex;flex-direction:column}
.login-in .brand-mark,.onb .brand-mark{margin-top:7vh}
.login h1,.onb h1{font-family:var(--f-display);font-size:32px;margin:16px 0 2px;line-height:1.3}
.lead{color:var(--ink-2);font-size:16px;margin:0}
.feat{list-style:none;padding:0;margin:26px 0;display:flex;flex-direction:column;gap:14px}
.feat li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-2);font-size:14.5px}
.feat b{display:block;color:var(--ink);font-size:15px}
.fi{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.fi svg{width:19px;height:19px}
.login-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:14px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:15.5px;width:100%;color:var(--ink)}
.gbtn.sm{min-height:44px;font-size:14.5px;margin-top:10px}
.notice{background:var(--accent-soft);color:var(--accent-2);border-radius:12px;padding:12px 14px;font-size:14px}
.notice.ok-notice{background:var(--done-soft);color:var(--done);display:flex;gap:8px;align-items:center;margin-bottom:10px} .notice .steps{margin:8px 0 0;padding-inline-start:20px;line-height:1.9}
.legal{font-size:12.5px;color:var(--ink-3);text-align:center;margin:12px 0 0}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;padding:6px;font-size:14px}
.linkbtn.center{display:block;margin:12px auto}
.onb .form{margin-top:24px}

/* layout */
#app{min-height:100vh}
main{padding:8px 16px calc(110px + env(safe-area-inset-bottom,0px));max-width:760px;margin-inline:auto}
.hdr{display:flex;align-items:flex-end;gap:12px;padding-block:14px 8px}
.hdr .grow{flex:1;min-width:0}
.hdr h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.3;margin:0}
.sub{color:var(--ink-3);font-size:13px}
.hello{color:var(--ink-2);font-size:14px;margin-top:2px}
.hdr-side{flex:none}
.desk{display:none!important}
.form input:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:520px){ .sync.ok .sl,.sync.local .sl,.sync:not([class*=' ']) .sl{display:none} .sync.ok,.sync.local,.sync:not([class*=' ']){padding:5px 7px} }
@media (max-width:400px){ .hdr h1{font-size:23px} }

/* nav: bottom bar on phones, sidebar on wide screens */
#nav{position:fixed;bottom:0;inset-inline:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-brand,.nav-foot{display:none}
.tab{position:relative;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);padding:6px 0;font-weight:500}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)} .tab.on span{font-weight:700}
.tab .dot{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--late);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;min-width:18px;line-height:18px;border-radius:99px;padding:0 4px;text-align:center}
.addbtn{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);border:none;display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);transform:translateY(-10px)}
.addbtn svg{width:28px;height:28px}
.addbtn .lbl{display:none}

/* sync chip */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap;font-weight:500;min-height:32px;position:relative}
button.sync::after{content:'';position:absolute;inset:-7px -4px}
.sync.ok{color:var(--done)} .sync.warn{color:var(--wait);border-color:color-mix(in srgb,var(--wait) 40%,var(--line))} .sync.err{color:var(--late);border-color:var(--late)} .sync.local{color:var(--ink-2)}

/* counters, start */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.counter{background:var(--card);border-radius:var(--r-sm);padding:10px 12px;border:1px solid var(--line);text-align:start;color:inherit}
.counter b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.15}
.counter span{font-size:12px;color:var(--ink-2)}
.counter.late b{color:var(--late)} .counter.fu b{color:var(--accent)}
.start{position:relative;background:var(--card);border-radius:var(--r);padding:16px 18px 16px 16px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid var(--line);overflow:hidden}
.start::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--accent)}
.eyebrow{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.start h2{font-family:var(--f-display);font-size:19px;line-height:1.5;margin:8px 0 4px;font-weight:700;overflow-wrap:anywhere}
.why{font-size:13px;color:var(--ink-2);font-weight:600} .why.late{color:var(--late)}
.start .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint-swipe{font-size:12px;color:var(--ink-3);text-align:center;margin:0 0 14px}
.allclear{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--done);font-weight:600;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-2);border-radius:var(--r-sm);padding:10px 12px;margin:6px 0 12px;font-size:14px}
.banner span{flex:1;min-width:180px}

/* sections & cards */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.sec-h h3{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.sec-h .grow{flex:1}
.cnt{font-size:12px;font-weight:700;background:var(--line);color:var(--ink-2);border-radius:99px;padding:0 8px;line-height:20px}
.cnt.late{background:var(--late-soft);color:var(--late)}
.stack{display:flex;flex-direction:column;gap:8px}
.swipe{position:relative;border-radius:var(--r);overflow:hidden;background:var(--line)}
.swipe .lbl{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:6px;padding-inline:18px;font-weight:700;font-size:13px;opacity:0;transition:opacity .15s}
.swipe .lbl.done{left:0;color:var(--done)} .swipe .lbl.later{right:0;color:var(--wait)}
.swipe.to-done{background:var(--done-soft)} .swipe.to-done .lbl.done{opacity:1}
.swipe.to-later{background:var(--wait-soft)} .swipe.to-later .lbl.later{opacity:1}
.tcard{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:var(--r);padding:13px 14px;border:1px solid var(--line);touch-action:pan-y;transition:transform .2s ease;cursor:pointer}
.tcard:hover{border-color:var(--line-2)}
.tcard .body{flex:1;min-width:0}
.tcard .t,.fu-row .t,.prow .t{font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.tcard.is-done .t{color:var(--ink-3);text-decoration:line-through} .tcard.is-log .t{color:var(--ink);text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12.5px;color:var(--ink-3);align-items:center}
.meta svg{vertical-align:-2px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.chk:hover{border-color:var(--done);background:var(--done-soft)}
.chk.on{background:var(--done);border-color:var(--done)}
.chk svg{width:13px;height:13px;color:#fff}
.stripe{position:absolute;inset-block:12px;inset-inline-start:0;width:3px;border-radius:3px}
.stripe.late{background:var(--late)} .stripe.wait{background:var(--wait)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:0 9px;border-radius:99px;background:var(--line);color:var(--ink-2);white-space:nowrap;line-height:21px}
.pill.late,.pill.hi{background:var(--late-soft);color:var(--late)} .pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.done{background:var(--done-soft);color:var(--done)} .pill.log{background:var(--accent-soft);color:var(--accent-2)} .pill.prog{background:var(--accent-soft);color:var(--accent-2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;background:var(--accent-soft);color:var(--accent-2);font-family:var(--f-display)}
.av.lg{width:44px;height:44px;font-size:17px} .av.xl{width:56px;height:56px;font-size:22px}
.fu-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fu-row.late{border-color:color-mix(in srgb,var(--late) 35%,var(--line))}
.fu-row .body{flex:1;min-width:0;cursor:pointer}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.prow .body{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .chev{color:var(--ink-3);transform:scaleX(-1)}
[dir=ltr] .prow .chev{transform:none}
.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty.small{padding:24px 10px}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:10px 0 4px;font-size:19px}
.empty p{margin:0 auto 18px;max-width:34ch}
.empty-ic{width:56px;height:56px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto;color:var(--accent)}
.empty-ic svg{width:26px;height:26px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:0 14px;min-height:42px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.lg{min-height:50px;font-size:15.5px}
.btn.block{width:100%;flex:1}
.btn.ok{background:var(--done-soft);border-color:transparent;color:var(--done)}
.btn.danger,.danger-btn{color:var(--late)} .danger-btn{background:var(--late);border-color:var(--late);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:40px;height:40px;border-radius:12px;border:none;background:transparent;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.sm{width:32px;height:32px} .iconbtn.sm svg{width:18px;height:18px}
.iconbtn:hover{background:var(--line)}
[dir=ltr] .flipx svg{transform:scaleX(-1)}

/* search, segments, chips */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px;margin:8px 0 10px}
.search svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;min-height:44px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{border:none;background:transparent;border-radius:9px;min-height:36px;font-weight:600;font-size:13px;color:var(--ink-2);padding:0 4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.seg2 button{flex:1;min-height:40px;border:1px solid var(--line-2);background:var(--card);border-radius:11px;font-weight:600;font-size:13.5px;color:var(--ink-2);padding:0 8px}
.seg2 button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.people-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.people-row::-webkit-scrollbar{display:none}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 10px 3px 4px;flex:none;font-size:13px;font-weight:600;color:var(--ink-2)}
[dir=rtl] .pchip{padding:3px 4px 3px 10px}
.pchip .av{width:26px;height:26px;font-size:12px}
.pchip i{font-style:normal;font-size:11px;background:var(--line);border-radius:99px;padding:0 6px}
.pchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips.top{margin:0 0 10px} .chips.filter{margin:0 0 10px}
.chip{flex-shrink:0;max-width:100%;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);border-radius:99px;padding:0 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip svg{flex:none}
.chip.missing{border-style:dashed;border-color:var(--wait);color:var(--wait);background:var(--wait-soft)}
.chip.hi{border-color:transparent;background:var(--late-soft);color:var(--late)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.chip .wk{font-size:11px;color:var(--wait)}
.chip.datein{padding-inline-end:4px;position:relative}
.chip.datein input{border:none;background:transparent;min-height:30px;max-width:170px;font-size:16px;color:inherit}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(15,21,34,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;inset-inline:0;margin-inline:auto;max-width:560px;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:var(--shadow-up);z-index:41;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:9px auto 2px;flex:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 16px}
[dir=rtl] .sheet-h{padding:4px 16px 4px 12px}
.sheet-h h3{flex:1;margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.sheet-b{padding:6px 16px 18px;overflow:auto}
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:9px 12px;min-height:44px;font-size:16px;color:var(--ink)}
.fld textarea{resize:vertical;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.save-row{display:flex;gap:8px;margin:4px 0 0}
.save-row.sticky{position:sticky;bottom:-18px;background:var(--card);padding:10px 0 4px}
.ctx{margin:0;color:var(--ink-2);font-weight:600;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
.warn-txt{color:var(--wait)} .err-txt{color:var(--late)}
.lab{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:14px}
.tips{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.7}
.composer{border:1.5px solid var(--line-2);border-radius:16px;background:var(--paper);padding:10px 12px;transition:border-color .15s}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;border:none;background:transparent;resize:none;min-height:56px;max-height:180px;outline:none;font-size:16px;line-height:1.6;color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px;margin-top:4px;min-height:48px}
.rec-state{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--late);flex:1}

.mi.lg{width:48px;height:48px;border-radius:14px} .mi.lg svg{width:24px;height:24px}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}

.hrow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}

.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.wk-nav b{font-size:14.5px}
.wk-late{display:flex;align-items:center;gap:6px;width:100%;border:1px solid color-mix(in srgb,var(--late) 35%,var(--line));background:var(--late-soft);color:var(--late);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px;margin-bottom:10px}
.wk{display:grid;gap:10px}
.wk-day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.wk-day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wk-day.past{opacity:.65}
.wk-h{display:flex;align-items:center;gap:8px}
.wk-h b{font-size:15px} .wk-h .num{color:var(--ink-3);font-size:13px} .wk-h .grow{flex:1}
.wk-item{display:flex;align-items:baseline;gap:8px;width:100%;text-align:start;background:none;border:none;border-top:1px dashed var(--line);padding:8px 0 6px;color:inherit}
.wk-item:first-of-type{margin-top:6px}
.wk-item .tm{min-width:56px;color:var(--accent-2);font-weight:700;font-size:13px}
.wk-item .t{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.wk-item .who{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.wk-item.fu .t{font-weight:500}
.wk-empty{color:var(--ink-3);font-size:13px;padding:4px 0 0}
.projlink{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
button.pill.projlink{border:none;display:inline-flex;align-items:center;gap:4px;text-decoration:none}

/* «متابعاتي» */
.seg.two{grid-template-columns:1fr 1fr}
.seg .cnt{margin-inline-start:4px;line-height:18px;font-size:11px}
.mf-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.mf-card.late{border-color:color-mix(in srgb,var(--late) 35%,var(--line))}
.mf-h{display:flex;align-items:center;gap:10px}
.mf-who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:none;padding:0;text-align:start;color:inherit}
.mf-who b{display:block;font-size:15.5px} .mf-who small{display:block;color:var(--ink-3);font-size:12.5px}
.mf-items{margin-top:8px;display:grid;gap:2px}
.mf-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.mf-item .body{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.mf-item .t{font-weight:600;font-size:14.5px}
.mf-item .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--ink-3)}
.mf-item.late .meta .due{color:var(--late);font-weight:600}
.mf-item .iconbtn{color:var(--accent)}
.mf-acts{display:flex;gap:8px;margin-top:8px}
.muted{color:var(--ink-3)}

/* first-use tour */
.tour{text-align:center;padding:4px 2px 0}
.tour-ic{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.tour-ic svg{width:28px;height:28px}
.tour h4{font-size:18px;margin:0 0 6px}
.tour p{color:var(--ink-2);margin:0 auto 12px;max-width:440px}
.tour-ex{background:var(--paper);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;margin:0 auto 12px;max-width:440px;font-size:14.5px;text-align:start}
.tour-roles{list-style:none;padding:0;margin:0 auto 12px;max-width:440px;text-align:start;display:grid;gap:6px}
.tour-roles li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--ink-2)}
.tour-roles b{color:var(--ink)}
.tour-dots{display:flex;gap:6px;justify-content:center;margin:4px 0 12px}
.tour-dots i{width:7px;height:7px;border-radius:99px;background:var(--line-2)}
.tour-dots i.on{width:20px;background:var(--accent)}

/* assistant chat */
.sheet.chat{height:92vh;height:92dvh;max-width:620px}
.sheet.chat .sheet-b{display:flex;flex-direction:column;padding:0;overflow:hidden;flex:1;min-height:0}
.chat-t{display:inline-flex;align-items:center;gap:6px;color:var(--accent-2)}
.chat-log{flex:1;overflow:auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.bubble{max-width:92%;border-radius:16px;padding:10px 13px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:5px}
.bubble.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-end-start-radius:5px;color:var(--ink)}
.bubble.drafts{max-width:100%;width:100%;display:flex;flex-direction:column;gap:8px}
.bubble .chips{margin-top:8px}
.dh{font-weight:700;color:var(--accent-2)}
.dcard{border:1px solid var(--line-2);border-radius:14px;padding:10px 12px;background:var(--card)}
.dcard.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dcard.ok{border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.dtop{display:flex;align-items:flex-start;gap:6px}
.dn{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:2px}
.dt{flex:1;min-width:0;font-weight:700;font-family:var(--f-display);font-size:15px;line-height:1.5}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.sm{min-height:26px;font-size:12px;padding:0 9px;gap:4px;border-color:var(--line)}
.chip.sm small{color:var(--ink-3);font-weight:500}
.chip.sm em{font-size:10.5px;color:var(--accent)}
.filepick{cursor:pointer;align-self:flex-start} .picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tcard .rc{display:inline-flex;color:var(--accent)}
.chip.sm.logc{background:var(--accent-soft);color:var(--accent-2);border-color:transparent;font-weight:600}
.dcard.log{border-style:dashed} .dcard.log.ok{border-style:solid}
.bubble .ask{margin-top:10px} .bubble .ask p{margin:0 0 6px}
.chip.primary-chip{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[disabled]{opacity:.45}
.ask.q{margin-top:2px}
.ask.q .qn{color:var(--accent)}
.ask .note{display:block;margin-top:8px}
.ready{color:var(--done);font-weight:600;display:flex;align-items:center;gap:6px}
.thinking{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13.5px}
.dots{display:inline-flex;gap:4px} .dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.3;animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
.chat-foot{flex:none;border-top:1px solid var(--line);background:var(--card);padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chat-sugg{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chat-sugg::-webkit-scrollbar{display:none}
.chat-sugg:empty{display:none}
.chat-sugg .chip{flex:none;min-height:30px;font-size:12.5px}
.chat-foot .composer{padding:6px 10px}
.chat-foot .composer textarea{min-height:26px;font-size:16px}
.chat-foot .tools{min-height:42px}
.linkbtn.sm{font-size:12.5px;display:inline-flex;align-items:center;gap:4px;color:var(--ink-2)}
.send{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send svg{width:19px;height:19px}
[dir=rtl] .send svg{transform:scaleX(-1)}
.chat-foot .mic{width:42px;height:42px;margin-inline-start:auto}
.qhead{font-weight:700;margin-bottom:6px} .qhead.sm{margin-top:10px;font-size:13.5px;color:var(--late)}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.qrow{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;color:var(--ink);font-size:13.5px}
.qrow.late{border-color:color-mix(in srgb,var(--late) 40%,var(--line))}
.qrow .t{font-weight:600;display:block;line-height:1.45} .qrow .body{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
.qrow>.t{flex:1;min-width:0}
.qrow .meta{margin-top:2px} .qrow .sub{font-size:12px;color:var(--ink-3)}
.av.sm{width:28px;height:28px;font-size:12px}
.req{color:var(--late);font-weight:700}
.chk-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:2px}
.chk-line input{width:17px;height:17px;accent-color:var(--accent)}
.src-row{display:flex;gap:8px;align-items:center} .src-row input{flex:1;min-width:0} .src-row .chip{flex:none}
.iconbtn.addman{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:36px;height:36px;align-self:flex-end}
.iconbtn.addman svg{width:20px;height:20px}
.fu-row .iconbtn{color:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;z-index:70;opacity:0;transition:all .2s;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.err{background:var(--late);color:#fff}
.toast button{border:none;background:transparent;color:#C9D4EA;font-weight:700;padding:0}

/* wide screens: sidebar + side panels + centered sheets */
@media (min-width:840px){
  #app{display:grid;grid-template-columns:248px 1fr}
  #app.bare{display:block}
  [dir=ltr] #app{grid-template-columns:248px 1fr}
  #nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:18px 12px;border-top:none;border-inline-end:1px solid var(--line);background:var(--card)}
  .nav-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-family:var(--f-display);font-size:18px;order:-2}
  .addbtn{order:-1;width:auto;height:46px;border-radius:12px;transform:none;display:flex;gap:8px;justify-content:center;margin-bottom:14px;box-shadow:none;font-weight:600}
  .addbtn .lbl{display:inline} .addbtn svg{width:20px;height:20px}
  .tab{flex-direction:row;gap:12px;font-size:14.5px;padding:10px 12px;border-radius:10px;justify-content:flex-start;color:var(--ink-2)}
  .tab svg{width:21px;height:21px}
  .tab:hover{background:var(--paper)}
  .tab.on{background:var(--accent-soft);color:var(--accent-2)}
  .tab .dot{position:static;margin-inline-start:auto}
  .nav-foot{display:block;margin-top:auto;padding:8px}
  main{padding:20px 28px 60px;width:100%}
  .hdr h1{font-size:28px}
  .desk{display:inline-flex!important}
  .mob{display:none!important}
  .tab.deskonly{display:flex}
  .hdr-side{display:none}
  .layer-backdrop{display:block}
  .layer-backdrop.on{opacity:1;pointer-events:auto}
  .layer{inset-inline-start:auto;width:min(620px,92vw);box-shadow:var(--shadow-up)}
  [dir=rtl] .layer{left:0;right:auto;transform:translateX(-105%)} [dir=ltr] .layer{right:0;left:auto;transform:translateX(105%)}
  .sheet{bottom:auto;top:50%;border-radius:20px;transform:translate(0,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;max-height:86vh}
  .sheet.on{transform:translate(0,-50%);opacity:1;pointer-events:auto}
  .grab{display:none}
  .toast{bottom:28px}
}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} }
.dd-host{position:relative}
input.dd{color:transparent!important;-webkit-text-fill-color:transparent}
input.dd::-webkit-datetime-edit{opacity:0}
input.dd::-webkit-datetime-edit-fields-wrapper{opacity:0}
.dd-show{position:absolute;display:flex;align-items:center;padding:0 34px 0 10px;pointer-events:none;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.dd-show.ph{color:var(--ink-3)} .dd-show.off{opacity:.45}
.chip.datein .dd-show{font-size:13px;padding:0 26px 0 4px}
@media (min-width:840px){ main{min-width:0} main.wide{max-width:1400px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
